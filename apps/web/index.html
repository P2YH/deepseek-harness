<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <title>DSH Local Build</title>
    <style>
      /* Paint a dependency-free first frame while the client bundle is loading. */
      html, body, #root { height: 100%; margin: 0; }
      body { color: #0f1115; background: #fff; font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      [data-dsh-boot-static] { height: 100%; display: grid; place-items: center; }
      [data-dsh-boot-static-card] { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      [data-dsh-boot-static-wordmark] { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: .08em; }
      [data-dsh-boot-static-spinner] { width: 20px; height: 20px; border: 2px solid rgb(0 0 0 / 10%); border-top-color: #0f1115; border-radius: 50%; animation: dsh-boot-spin .8s linear infinite; }
      [data-dsh-boot-static-hint] { color: #81858c; font-size: 12px; line-height: 18px; }
      @keyframes dsh-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div data-dsh-boot-static aria-label="Loading"><div data-dsh-boot-static-card><div data-dsh-boot-static-wordmark>HARNESS</div><div data-dsh-boot-static-spinner></div><div data-dsh-boot-static-hint>Loading plugins…</div></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
